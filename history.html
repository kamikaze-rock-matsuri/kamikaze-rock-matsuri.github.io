    body {

        font-family: "MS PGothic", monospace;
        margin: 0;
        padding: 0;

    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 30px 20px 80px;
    }

    }

        font-size: 24px;
        margin-bottom: 15px;
    }

    .place {
        font-weight: bold;
        color: #0000CC;
    }

    hr {
        border: none;
        border-top: 2px dashed #888;
        margin: 60px 0;
    }

    .footer {
        text-align: center;
        font-size: 18px;
        margin-top: 50px;
    }

    @media (max-width: 600px) {

        h1 {
            font-size: 38px;
        }

        .live h2 {
            font-size: 26px;
        }

        .live p {
            font-size: 20px;
        }

        .home a {

        }
    }
</style>
