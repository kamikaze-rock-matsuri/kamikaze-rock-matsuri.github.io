<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>真のメンバー紹介 // 神風ロック祭り</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at top, #1a0033, #000010);
    font-family: "MS PGothic", monospace;
    color: #fff;
    overflow-x: hidden;
}

/* ノイズっぽい揺らぎ */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("images/noise.png");
    opacity: 0.05;
    pointer-events: none;
}

/* タイトル */
h1 {
    text-align: center;
    margin: 40px 0;
    font-size: 42px;
    letter-spacing: 5px;
    color: #ff00ff;
    text-shadow: 0 0 10px cyan, 0 0 20px magenta;
    animation: glitch 2s infinite;
}

@keyframes glitch {
    0% { transform: translate(0,0); }
    20% { transform: translate(2px,-1px); }
    40% { transform: translate(-2px,1px); }
    60% { transform: translate(1px,2px); }
    80% { transform: translate(-1px,-2px); }
    100% { transform: translate(0,0); }
}

/* カード全体 */
.container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
}

/* カード */
.card {
    background: rgba(20, 0, 40, 0.7);
    border: 2px solid #ff00ff;
    box-shadow: 0 0 15px rgba(255,0,255,0.4);
    padding: 15px;
    transform: rotate(-1deg);
    transition: 0.2s;
}

.card:nth-child(even) {
    transform: rotate(1deg);
    border-color: cyan;
}

.card:hover {
    transform: scale(1.05) rotate(0deg);
    box-shadow: 0 0 25px white;
}

/* 画像 */
.card img {
    width: 100%;
    height: 350px;
    object-fit: cover;
    border: 2px solid #fff;
    margin-bottom: 10px;
}

/* 名前 */
.name {
    font-size: 22px;
    font-weight: bold;
    color: yellow;
    margin-bottom: 5px;
    text-shadow: 0 0 5px red;
}

/* 説明 */
.desc {
    font-size: 12px;
    line-height: 1.6;
    color: #ddd;
}

/* 戻る */
.back {
    text-align: center;
    margin: 40px;
    font-size: 18px;
}

.back a {
    color: cyan;
    text-decoration: none;
}

.back a:hover {
    text-shadow: 0 0 10px cyan;
}
</style>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-H1DF0PD26X"></script>

  gtag('js', new Date());

  gtag('config', 'G-H1DF0PD26X');
</script>
    
</head>

<body>
